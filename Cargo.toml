[package]
name = "rust-durable-queue"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A durable async job queue with bounded backpressure"

[dependencies]
crc32fast = "1"
fs4 = "0.12"
postcard = { version = "1", features = ["alloc"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "test-util"] }
