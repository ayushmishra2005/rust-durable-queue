[package]
name = "rust-durable-queue"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A durable async job queue with bounded backpressure"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "test-util"] }
